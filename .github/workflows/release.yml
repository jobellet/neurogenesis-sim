name: Release

# Desktop apps with an embedded Python runtime (desktop/common/runtime): built on version tags (v1.2.3; attached to the
# GitHub release by the publish job) or by hand (Actions -> Release -> Run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtimes:
    # The shared runtime script on the other apps' systems. Native builds are smoke-tested (bridge handshake and JAX,
    # empty environment); linux-arm64 is cross-built on x86_64 and only checked to build (no arm64 runner here).
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, target: linux-x86_64, smoke: true}
          - {runner: windows-latest, target: windows-x86_64, smoke: true}
          - {runner: ubuntu-latest, target: linux-arm64, smoke: false}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the runtime (${{ matrix.target }}, locked packages)
        run: python desktop/common/runtime/build_runtime.py --target ${{ matrix.target }} --out build/runtime
      - name: Smoke test (empty environment)
        if: matrix.smoke
        run: python desktop/common/runtime/smoke_test.py build/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-manifest-${{ matrix.target }}
          path: build/runtime/runtime.json

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel     # Intel (x86_64)
            target: macos-x86_64
          - runner: macos-15           # Apple Silicon (arm64)
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import the signing certificate (if configured)
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.CERT_P12 != ''
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm cert.p12
      - name: Python runtime (${{ matrix.target }}, locked packages)
        run: python desktop/common/runtime/build_runtime.py --target ${{ matrix.target }} --out desktop/mac/build/runtime-${{ matrix.target }}
      - name: App and disk image
        env:
          NG_RUNTIME: build/runtime-${{ matrix.target }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: desktop/mac/release.sh
      - name: Smoke test from the disk image (no outside libraries; bridge and JAX with an empty environment)
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/ngdmg desktop/mac/build/Neurogenesis-*.dmg
          desktop/mac/tools/check_bundle.sh /tmp/ngdmg/Neurogenesis.app
          mkdir -p /tmp/ngrt && ln -s /tmp/ngdmg/Neurogenesis.app/Contents/Resources/python /tmp/ngrt/python
          cp /tmp/ngdmg/Neurogenesis.app/Contents/Resources/runtime.json /tmp/ngrt/
          python desktop/common/runtime/smoke_test.py /tmp/ngrt
          hdiutil detach /tmp/ngdmg
      - uses: actions/upload-artifact@v4
        with:
          name: Neurogenesis-${{ matrix.target }}
          path: |
            desktop/mac/build/Neurogenesis-*.dmg
            desktop/mac/build/Neurogenesis-*.dmg.sha256

  publish:
    # The only job that can write to the repository: attaches the disk images to the release of a version tag.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [runtimes, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Neurogenesis-*
          merge-multiple: true
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Desktop apps: see desktop/*/README.md"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
