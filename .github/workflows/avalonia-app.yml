name: Avalonia Desktop App (Windows & Linux)

on:
  push:
    paths:
      - 'desktop/avalonia/**'
      - '.github/workflows/avalonia-app.yml'
  pull_request:
    paths:
      - 'desktop/avalonia/**'
      - '.github/workflows/avalonia-app.yml'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Generate NGB fixtures
        run: |
          python desktop/avalonia/tests/make_ngb_fixtures.py ${{ runner.temp }}/ngbfixtures

      - name: Restore dependencies
        run: dotnet restore desktop/avalonia/Neurogenesis.Desktop.sln

      - name: Build solution
        run: dotnet build desktop/avalonia/Neurogenesis.Desktop.sln --configuration Release --no-restore

      - name: Run xUnit tests
        env:
          NG_NGB_FIXTURES: ${{ runner.temp }}/ngbfixtures
        run: dotnet test desktop/avalonia/Neurogenesis.Desktop.sln --configuration Release --no-build --verbosity normal --logger "trx"
