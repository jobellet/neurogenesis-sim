name: Avalonia Desktop App (Windows & Linux)

on:
  push:
    paths:
      - 'desktop/avalonia/**'
      - 'desktop/common/**'
      - 'neurogenesis/bridge/**'
      - '.github/workflows/avalonia-app.yml'
  pull_request:
    paths:
      - 'desktop/avalonia/**'
      - 'desktop/common/**'
      - 'neurogenesis/bridge/**'
      - '.github/workflows/avalonia-app.yml'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Generate NGB fixtures
        run: |
          python desktop/avalonia/tests/make_ngb_fixtures.py ${{ runner.temp }}/ngbfixtures

      - name: Build nglif C kernel
        run: |
          cmake -S desktop/common/native/nglif -B build/nglif
          cmake --build build/nglif --config Release
          ctest --test-dir build/nglif -C Release --output-on-failure

      - name: Restore dependencies
        run: dotnet restore desktop/avalonia/Neurogenesis.Desktop.sln

      - name: Build solution
        run: dotnet build desktop/avalonia/Neurogenesis.Desktop.sln --configuration Release --no-restore

      - name: Copy nglif library to tests output
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mkdir -p desktop/avalonia/tests/Neurogenesis.Tests/bin/Release/net8.0/
            cp build/nglif/Release/nglif.dll desktop/avalonia/tests/Neurogenesis.Tests/bin/Release/net8.0/ || cp build/nglif/nglif.dll desktop/avalonia/tests/Neurogenesis.Tests/bin/Release/net8.0/
          else
            mkdir -p desktop/avalonia/tests/Neurogenesis.Tests/bin/Release/net8.0/
            cp build/nglif/libnglif.so desktop/avalonia/tests/Neurogenesis.Tests/bin/Release/net8.0/
          fi

      - name: Run xUnit tests
        env:
          NG_PYTHON: python
          NG_NGB_FIXTURES: ${{ runner.temp }}/ngbfixtures
        run: dotnet test desktop/avalonia/Neurogenesis.Desktop.sln --configuration Release --no-build --verbosity normal --logger "trx"

      - name: Build Windows package (Installer + Portable Zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File desktop/avalonia/packaging/build-windows.ps1 -OutputDir dist
          Get-ChildItem dist

      - name: Smoke test packaged Python bridge (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = (Resolve-Path "publish/win-x64/runtime/python/python.exe").Path
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $py
          $psi.Arguments = "-m neurogenesis.bridge"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.EnvironmentVariables.Clear()
          $psi.EnvironmentVariables["SystemRoot"] = $env:SystemRoot
          $psi.EnvironmentVariables["JAX_PLATFORMS"] = "cpu"
          $psi.EnvironmentVariables["PYTHONNOUSERSITE"] = "1"
          $proc = [System.Diagnostics.Process]::Start($psi)
          $proc.StandardInput.WriteLine('{"id": 1, "method": "ping"}')
          $proc.StandardInput.Flush()
          $proc.StandardInput.Close()
          $out = $proc.StandardOutput.ReadToEnd()
          $err = $proc.StandardError.ReadToEnd()
          $proc.WaitForExit(30000)
          Write-Host "Bridge output: $out"
          if ($out -notmatch '"result":\s*"pong"') {
              Write-Error "Bridge stderr: $err"
              throw "Bridge smoke test failed: did not receive pong in clean environment"
          }

      - name: Build Linux package (AppImage + tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x desktop/avalonia/packaging/build-appimage.sh
          ./desktop/avalonia/packaging/build-appimage.sh dist
          ls -lh dist

      - name: Smoke test packaged Python bridge (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PY="build/AppDir/usr/runtime/python/bin/python3"
          RESPONSE=$(env -i JAX_PLATFORMS=cpu PYTHONNOUSERSITE=1 "${PY}" -m neurogenesis.bridge <<<'{"id": 1, "method": "ping"}')
          echo "Bridge output: ${RESPONSE}"
          if [[ "${RESPONSE}" != *'"result": "pong"'* ]]; then
            echo "Bridge smoke test failed: did not receive pong in clean environment" >&2
            exit 1
          fi

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neurogenesis-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
