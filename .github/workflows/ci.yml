name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      viewer: ${{ steps.filter.outputs.viewer }}
      nglif: ${{ steps.filter.outputs.nglif }}
      mac-app: ${{ steps.filter.outputs.mac-app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'neurogenesis/**'
              - 'scripts/benchmark_performance.py'
              - 'tests/**'
              - 'pyproject.toml'
              - 'viz/src/sim/**'
              - '.github/workflows/ci.yml'
            viewer:
              - 'viz/**'
              - '.github/workflows/ci.yml'
            nglif:
              - 'desktop/common/native/nglif/**'
              - 'desktop/common/fixtures/**'
              - 'tests/test_nglif_fixtures.py'
              - '.github/workflows/ci.yml'
            mac-app:
              - 'desktop/mac/**'
              - 'desktop/common/**'
              - 'neurogenesis/bridge/**'
              - '.github/workflows/ci.yml'

  python:
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Build the browser kernel (for the Python / JAX / browser equivalence tests)
        working-directory: viz
        run: |
          npm ci
          npm run build:kernel
      - name: Tests (every neuron model, development, evolution, modules, cost estimates)
        env:
          JAX_PLATFORMS: cpu
        run: pytest -q -ra
      - name: Fail if any test was skipped
        env:
          JAX_PLATFORMS: cpu
        run: |
          pytest -q -rs tests/test_kernel.py | tee skipped.txt
          ! grep -q "SKIPPED" skipped.txt
      - name: Cost estimator command line
        env:
          JAX_PLATFORMS: cpu
        run: python -m neurogenesis estimate --neurons 3e8 --synapses-per-neuron 5000 --seconds 1

  performance:
    # Compare fixed CPU workloads with the most recent successful main-branch benchmark.
    needs: detect-changes
    if: >-
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.python == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download latest main-branch baseline
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          branch: main
          name: performance-baseline
          path: performance-baseline
          if_no_artifact_found: warn
      - name: Run benchmarks and enforce the 30% regression limit
        env:
          JAX_PLATFORMS: cpu
        run: >-
          python scripts/benchmark_performance.py
          --output performance.json
          --baseline performance-baseline/performance.json
      - name: Save main-branch baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: performance.json
          retention-days: 90

  viewer:
    needs: detect-changes
    if: >-
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.viewer == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Type-check and build the 3D viewer
        working-directory: viz
        run: |
          npm ci
          npm run build

  nglif-ubuntu:
    # nglif golden fixtures on Ubuntu (fast, standard minutes; runs on every non-draft PR touching nglif)
    needs: detect-changes
    if: >-
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.nglif == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build nglif and its fixture test
        run: |
          cmake -S desktop/common/native/nglif -B build/nglif -DCMAKE_BUILD_TYPE=Release
          cmake --build build/nglif --config Release
      - name: Golden fixtures (bit-identical to the Python reference)
        run: ctest --test-dir build/nglif -C Release --output-on-failure

  nglif-cross:
    # nglif on macOS (10x minutes) and Windows (2x minutes): runs ONLY on push to main, workflow_dispatch, or PRs with 'full-ci' label
    needs: detect-changes
    if: >-
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.nglif == 'true') &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          contains(github.event.pull_request.labels.*.name, 'full-ci')
        )
      )
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build nglif and its fixture test
        run: |
          cmake -S desktop/common/native/nglif -B build/nglif -DCMAKE_BUILD_TYPE=Release
          cmake --build build/nglif --config Release
      - name: Golden fixtures (bit-identical to the Python reference)
        run: ctest --test-dir build/nglif -C Release --output-on-failure

  mac-app:
    # macOS app (10x minutes): runs ONLY on push to main, workflow_dispatch, or PRs with 'full-ci' label
    needs: detect-changes
    if: >-
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.mac-app == 'true') &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          contains(github.event.pull_request.labels.*.name, 'full-ci')
        )
      )
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the toolbox
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Build the app
        run: NG_PYTHON="$(which python)" desktop/mac/build.sh --no-install
      - name: Tests (Swift binding, bridge, fixtures)
        env:
          JAX_PLATFORMS: cpu
        run: pytest -q -ra desktop/mac/tests tests/test_bridge.py tests/test_nglif_fixtures.py
