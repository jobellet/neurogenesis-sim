name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Build the browser kernel (for the Python / JAX / browser equivalence tests)
        working-directory: viz
        run: |
          npm ci
          npm run build:kernel
      - name: Tests (every neuron model, development, evolution, modules, cost estimates)
        env:
          JAX_PLATFORMS: cpu
        run: pytest -q -ra
      - name: Fail if any test was skipped
        env:
          JAX_PLATFORMS: cpu
        run: |
          pytest -q -rs tests/test_kernel.py | tee skipped.txt
          ! grep -q "SKIPPED" skipped.txt
      - name: Cost estimator command line
        env:
          JAX_PLATFORMS: cpu
        run: python -m neurogenesis estimate --neurons 3e8 --synapses-per-neuron 5000 --seconds 1

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Type-check and build the 3D viewer
        working-directory: viz
        run: |
          npm ci
          npm run build

  nglif:
    # The shared C kernel of the desktop apps, built with each OS's own C compiler, against the golden fixtures.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build nglif and its fixture test
        run: |
          cmake -S desktop/common/native/nglif -B build/nglif -DCMAKE_BUILD_TYPE=Release
          cmake --build build/nglif --config Release
      - name: Golden fixtures (bit-identical to the Python reference)
        run: ctest --test-dir build/nglif -C Release --output-on-failure

  mac-app:
    # The macOS app: built with desktop/mac/build.sh, then its Swift-to-C binding, the bridge and the fixtures tested.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the toolbox
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Build the app
        run: NG_PYTHON="$(which python)" desktop/mac/build.sh --no-install
      - name: Tests (Swift binding, bridge, fixtures)
        env:
          JAX_PLATFORMS: cpu
        run: pytest -q -ra desktop/mac/tests tests/test_bridge.py tests/test_nglif_fixtures.py
